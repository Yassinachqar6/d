services:
  - type: web
    name: studentslides-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 10000
      - key: REQUIRE_AUTH_FOR_GENERATION
        value: true
      - key: MAX_SLIDES
        value: 20
      - key: GENERATION_QUOTA_PER_HOUR
        value: 3
      - key: IMAGE_SEARCH_LIMIT
        value: 3
      - key: GEMINI_TIMEOUT_MS
        value: 25000
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: 7000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
