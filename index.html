<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1024" />
    <meta name="description" content="StudentSlides AI turns your ideas into clear, presentation-ready lessons." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>StudentSlides AI — Make your next idea unforgettable</title>
    <script>
      (() => {
        const mode = localStorage.getItem("studentslides-theme");
        const dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
